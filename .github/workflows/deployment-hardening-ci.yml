name: Deployment Hardening CI

on:
  push:
    branches:
      - chore/deployment-hardening
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  build-release:
    runs-on: windows-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Setup NuGet
        uses: NuGet/setup-nuget@v4

      - name: Setup MSBuild
        uses: microsoft/setup-msbuild@v3
        with:
          msbuild-architecture: x64

      - name: Restore NuGet packages
        run: nuget restore WebApplication1.sln

      - name: Build Release
        run: msbuild WebApplication1.sln /m /p:Configuration=Release /p:Platform="Any CPU" /p:RunCodeAnalysis=false /v:minimal
